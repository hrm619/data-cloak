[project]
name = "data-cloak"
version = "0.1.0"
description = "Deterministic PII anonymization for CSV files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.8.0",
    "pandas>=3.0.1",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "faker>=24.0.0",
    "duckdb>=0.10.0",
    "pytest>=8.0.0",
    "pytest-html>=4.0.0",
]

[project.scripts]
data-cloak = "main:main"
